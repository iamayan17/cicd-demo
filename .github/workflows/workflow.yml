name: CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =========================
  # CI
  # =========================
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MY_DOCKER_USERNAME }}
          password: ${{ secrets.MY_DOCKER_PWD }}

      - name: Build Docker Image
        run: |
          docker build -t mohdayan17/cicd-demo:latest .
          docker build -t mohdayan17/cicd-demo:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push mohdayan17/cicd-demo:latest
          docker push mohdayan17/cicd-demo:${{ github.sha }}

  # =========================
  # CD
  # =========================
  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy Application
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update Image
        run: |
          kubectl set image deployment/cicd-demo \
            cicd-demo=mohdayan17/cicd-demo:${{ github.sha }}

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/cicd-demo --timeout=180s

      - name: Verify Deployment
        run: |
          kubectl get deployment cicd-demo
          kubectl get pods -l app=cicd-demo
          kubectl get service cicd-demo-service
