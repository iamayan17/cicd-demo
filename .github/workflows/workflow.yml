name: CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =========================
  # CI
  # =========================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MY_DOCKER_USERNAME }}
          password: ${{ secrets.MY_DOCKER_PWD }}

      - name: Build Image
        run: |
          docker build \
            -t ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:latest \
            -t ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:latest
          docker push ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:${{ github.sha }}

  # =========================
  # CD
  # =========================
  deploy:
    name: Deploy to Killercoda Kubernetes
    needs: build-and-push
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Kubernetes
        run: |
          echo "Current user:"
          whoami

          echo "Kubernetes context:"
          kubectl config current-context

          echo "Cluster:"
          kubectl cluster-info

          echo "Nodes:"
          kubectl get nodes

      - name: Deploy Kubernetes Resources
        run: |
          kubectl apply -f k8s/

      - name: Update Docker Image
        run: |
          kubectl set image deployment/my-app \
            my-app=${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:${{ github.sha }}

      - name: Check Rollout
        run: |
          kubectl rollout status deployment/my-app --timeout=180s

      - name: Verify Deployment
        run: |
          kubectl get deployment my-app
          kubectl get pods -l app=my-app
          kubectl get service my-app-service

      - name: Show Endpoint
        run: |
          kubectl get service my-app-service
