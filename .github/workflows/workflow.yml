name: CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build-and-push:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MY_DOCKER_USERNAME }}
          password: ${{ secrets.MY_DOCKER_PWD }}

      - name: Build Image
        run: |
          docker build \
            -t ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:latest \
            -t ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:latest
          docker push ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:${{ github.sha }}

  deploy:
    name: CD
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy
        run: |
          kubectl apply -f k8s/

      - name: Show Resources
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
