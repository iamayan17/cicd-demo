name: CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build-and-push:
    name: CI - Build and Push
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MY_DOCKER_USERNAME }}
          password: ${{ secrets.MY_DOCKER_PWD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:latest \
            -t ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:latest
          docker push ${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:${{ github.sha }}

  deploy:
    name: CD - Deploy to Kubernetes
    needs: build-and-push
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check Kubernetes Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update Application Image
        run: |
          kubectl set image deployment/my-app \
            my-app=${{ secrets.MY_DOCKER_USERNAME }}/cicd-demo:${{ github.sha }}

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/my-app --timeout=180s

      - name: Verify Deployment
        run: |
          kubectl get deployment my-app
          kubectl get pods -l app=my-app
          kubectl get service my-app-service

      - name: Show Endpoint
        run: |
          kubectl get service my-app-service
